name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compressed assets must not also exist uncompressed
        run: |
          for z in $(find assets -name '*.gz'); do
            if [ -e "${z%.gz}" ]; then echo "duplicate: ${z%.gz} and $z"; exit 1; fi
          done
      - name: JavaScript syntax check
        run: for f in assets/*.js; do node --check "$f"; done
      # The window (WebView2) is Windows-only; markdown, sanitizer and server logic are portable.
      - run: cargo test --locked

  ui:
    name: ui tests (headless chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Skipped (with a notice) if tests/ui was not committed, instead of failing the whole run.
      - name: Check tests/ui exists
        id: ui
        run: |
          if [ -f tests/ui/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::tests/ui is missing from this commit - UI tests skipped"; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.ui.outputs.present == 'true'
        with:
          node-version: 22
      - name: Install
        if: steps.ui.outputs.present == 'true'
        working-directory: tests/ui
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run
        if: steps.ui.outputs.present == 'true'
        working-directory: tests/ui
        run: npm test

  windows:
    name: build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --release
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: mdview-windows-x64
          path: target/release/mdview.exe
          if-no-files-found: error

  # Advisory only: reports style, lint and dependency-advisory findings without blocking the build.
  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
        continue-on-error: true
      - run: cargo clippy --locked --all-targets -- -D warnings
        continue-on-error: true
      - run: cargo install cargo-audit --locked && cargo audit
        continue-on-error: true

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, ui, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mdview-windows-x64
      - name: Checksum
        run: sha256sum mdview.exe > mdview.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mdview.exe
            mdview.exe.sha256
