name: Regenerate Cargo.lock (temporary)

on:
  push:
    branches: [fix/regenerate-cargo-lock]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate lockfile
        run: |
          cargo update
          git diff --stat -- Cargo.lock
          git diff --check
      - name: Verify locked dependency graph
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Commit lockfile and remove temporary workflow
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git rm .github/workflows/regenerate-lock.yml
          git diff --cached --check
          git commit -m "chore: regenerate Cargo.lock"
          git push origin "HEAD:${BRANCH}"
